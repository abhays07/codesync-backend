server:
    port: 9000

logging:
    level:
        org.springframework.cloud.gateway: INFO
        org.springframework.http.server.reactive: INFO
        org.springframework.web.reactive: INFO
        reactor.netty.http.server: INFO

spring:
    config:
        import: optional:file:../.env[.properties]
    application:
        name: api-gateway
    cloud:
        gateway:
            # --- CORS Configuration ---
            server:
                webflux:
                    globalcors:
                        add-to-simple-url-handler-mapping: true
                        cors-configurations:
                            "[/**]":
                                allowedOriginPatterns: "*"
                                allowedMethods:
                                    [
                                        "GET",
                                        "POST",
                                        "PUT",
                                        "DELETE",
                                        "PATCH",
                                        "OPTIONS",
                                    ]
                                allowedHeaders: "*"
                                allowCredentials: true

                    # --- HTTP Client Timeouts ---
                    httpclient:
                        connect-timeout: 10000
                        response-timeout: 30s

                    discovery:
                        locator:
                            enabled: true
                            lower-case-service-id: true

                    routes:
                        - id: auth-service
                          uri: lb://auth-service
                          predicates:
                              - Path=/api/v1/auth/**

                        - id: admin-users
                          uri: lb://auth-service
                          predicates:
                              - Path=/api/v1/admin/users/**

                        - id: project-service
                          uri: lb://project-service
                          predicates:
                              - Path=/api/v1/projects/**

                        - id: admin-projects
                          uri: lb://project-service
                          predicates:
                              - Path=/api/v1/admin/projects/**

                        - id: file-service
                          uri: lb://file-service
                          predicates:
                              - Path=/api/v1/files/**

                        - id: collab-service
                          uri: lb://collab-service
                          predicates:
                              - Path=/api/v1/sessions/**

                        - id: execution-service
                          uri: lb://execution-service
                          predicates:
                              - Path=/api/v1/executions/**

                        - id: comment-service
                          uri: lb://comment-service
                          predicates:
                              - Path=/api/v1/comments/**

                        - id: notification-service
                          uri: lb://notification-service
                          predicates:
                              - Path=/api/v1/notifications/**

                        - id: version-service
                          uri: lb://version-service
                          predicates:
                              - Path=/api/v1/versions/**

                        - id: notification-ws
                          uri: lb://notification-service
                          predicates:
                              - Path=/ws-notifications/**

                        - id: collab-ws
                          uri: lb://collab-service
                          predicates:
                              - Path=/ws-collab/**

                        - id: payment-service
                          uri: lb://payment-service
                          predicates:
                              - Path=/api/v1/payments/**

                        - id: admin-payments
                          uri: lb://payment-service
                          predicates:
                              - Path=/api/v1/admin/payments/**

                        - id: openapi-auth
                          uri: lb://auth-service
                          predicates:
                              - Path=/v3/api-docs/auth-service
                          filters:
                              - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

                        - id: openapi-project
                          uri: lb://project-service
                          predicates:
                              - Path=/v3/api-docs/project-service
                          filters:
                              - RewritePath=/v3/api-docs/project-service, /v3/api-docs

                        - id: openapi-file
                          uri: lb://file-service
                          predicates:
                              - Path=/v3/api-docs/file-service
                          filters:
                              - RewritePath=/v3/api-docs/file-service, /v3/api-docs

                        - id: openapi-collab
                          uri: lb://collab-service
                          predicates:
                              - Path=/v3/api-docs/collab-service
                          filters:
                              - RewritePath=/v3/api-docs/collab-service, /v3/api-docs

                        - id: openapi-execution
                          uri: lb://execution-service
                          predicates:
                              - Path=/v3/api-docs/execution-service
                          filters:
                              - RewritePath=/v3/api-docs/execution-service, /v3/api-docs

                        - id: openapi-comment
                          uri: lb://comment-service
                          predicates:
                              - Path=/v3/api-docs/comment-service
                          filters:
                              - RewritePath=/v3/api-docs/comment-service, /v3/api-docs

                        - id: openapi-notification
                          uri: lb://notification-service
                          predicates:
                              - Path=/v3/api-docs/notification-service
                          filters:
                              - RewritePath=/v3/api-docs/notification-service, /v3/api-docs

                        - id: openapi-version
                          uri: lb://version-service
                          predicates:
                              - Path=/v3/api-docs/version-service
                          filters:
                              - RewritePath=/v3/api-docs/version-service, /v3/api-docs

                        - id: openapi-payment
                          uri: lb://payment-service
                          predicates:
                              - Path=/v3/api-docs/payment-service
                          filters:
                              - RewritePath=/v3/api-docs/payment-service, /v3/api-docs

eureka:
    client:
        service-url:
            defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    instance:
        prefer-ip-address: true

springdoc:
    swagger-ui:
        urls:
            - name: "01. Auth Service"
              url: "/v3/api-docs/auth-service"
            - name: "02. Project Service"
              url: "/v3/api-docs/project-service"
            - name: "03. File Service"
              url: "/v3/api-docs/file-service"
            - name: "04. Collab Service"
              url: "/v3/api-docs/collab-service"
            - name: "05. Execution Service"
              url: "/v3/api-docs/execution-service"
            - name: "06. Comment Service"
              url: "/v3/api-docs/comment-service"
            - name: "07. Notification Service"
              url: "/v3/api-docs/notification-service"
            - name: "08. Version Service"
              url: "/v3/api-docs/version-service"
            - name: "09. Payment Service"
              url: "/v3/api-docs/payment-service"

jwt:
    secret: ${JWT_SECRET}
    expiry: ${TOKEN_EXPIRY:86400000}
