server:
  port: 8082

spring:
  application:
    name: project-service
  datasource:
    # Hardcoded to local for DEV environment
    url: jdbc:mysql://localhost:3306/codesync_project_db?createDatabaseIfNotExist=true
    username: root
    # Make sure this matches your local MySQL password
    password: ${DB_PASSWORD:05052005}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # HINT: You can remove the 'dialect' property if you are using a recent Hibernate version
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,env"
  endpoint:
    health:
      show-details: always